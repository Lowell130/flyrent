services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flyrent_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - DB_NAME=flyrent

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flyrent_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
